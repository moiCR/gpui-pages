[package]
name = "gpui-pages"
description = "Directory-based routing library for GPUI"
readme.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "gpui_pages"
path = "src/lib.rs"

[features]
default = ["runtime"]
runtime = ["dep:gpui", "dep:gpui-pages-macros"]
codegen = ["dep:gpui-pages-codegen"]

[dependencies]
gpui = { workspace = true, optional = true }
gpui-pages-codegen = { version = "0.1.0", path = "../codegen", optional = true }
gpui-pages-macros = { version = "0.1.0", path = "../macros", optional = true }
