[package]
name = "gpui-pages"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "gpui_pages"
path = "src/lib.rs"

[features]
default = ["runtime"]
runtime = ["dep:gpui", "dep:pages-macros"]
codegen = ["dep:pages-codegen"]

[dependencies]
gpui = { workspace = true, optional = true }
pages-codegen = { path = "../codegen", optional = true }
pages-macros = { path = "../macros", optional = true }
